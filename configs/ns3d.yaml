experiment:
  name: "NS3D_Turbulence"
  seed: 42
  log_dir: "default"   # Will be overridden strictly into runs/

data:
  dataset: "NS3DDataset"
  path: "C:\\Users\\DIAT\\opeartor_learning\\ICML_rebuttal\\datasets\\NS3D\\3D_CFD_Turb_M1.0_Eta1e-08_Zeta1e-08_periodic_Train.hdf5"
  t_input_idx: 0
  t_target_idx: -1
  sub: 2               # Subsamples 64x64x64 grid to 32x32x32 = 32768 spatial points
  batch_size: 2
  train_ratio: 0.8
  num_workers: 4       # Multi-threaded dataloaders for lazy HDF5 parsing

model:
  d_in: 5              # Vx, Vy, Vz, rho, p
  d_out: 5             # Target state
  d_model: 64          # Operator lifting capacity
  n_layers: 4          # Number of P-Adic blocks 
  n_heads: 4           # Cross-resolution attention heads
  p: 2                 # Spatial topology base (Z-order binary tree)
  L: 15                # 2^15 = 32,768 precisely bounds the Z-ordered 3D chunk space
  kernel_type: "exponential"
  content_blend: 0.2

training:
  epochs: 100
  learning_rate: 0.001
  weight_decay: 0.0001
  mixed_precision: true # Mandatory for vast 3D arrays
  checkpoint_interval: 10
  loss_fn: "sob_l1"    # Sobolev H1 error metric mapping
  loss_weight: 0.5
