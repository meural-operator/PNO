experiment_name: "Burgers1D_Standard"
data:
  path: "C:/Users/DIAT/opeartor_learning/ICML_rebuttal/datasets/Burgers/1D_Burgers_Sols_Nu0.1.hdf5"
  n_samples: 10000
  train_ratio: 0.8
  sub: 4
  t_target_idx: -1

model:
  d_in: 1
  d_out: 1
  d_model: 96
  n_layers: 6
  n_heads: 4
  p: 3
  L: 6
  kernel_type: "exponential"
  mlp_ratio: 2.0
  dropout: 0.05
  content_blend: 0.25

training:
  batch_size: 64
  epochs: 500
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_epochs: 20
  grad_clip_norm: 1.0
  use_amp: true
  early_stopping_patience: 100
  num_workers: 4
  use_sobolev: true
  sobolev_lambda: 0.5
