experiment_name: "Cylinder2D_Standard"
data:
  dataset_type: "cylinder2d"
  path: "C:/Users/DIAT/opeartor_learning/ICML_rebuttal/datasets/cylinder2d.nc"
  dt_steps: 10
  sub_spatial: 4
  sub_temporal: 2
  train_ratio: 0.8
  val_ratio: 0.1

model:
  d_in: 2         # u, v velocity fields
  d_out: 2        # u, v at target time
  d_model: 64
  n_layers: 4
  n_heads: 4
  p: 3
  L: 8
  kernel_type: "exponential"
  mlp_ratio: 4.0
  dropout: 0.05
  content_blend: 0.1

training:
  batch_size: 8
  epochs: 500
  learning_rate: 0.001
  weight_decay: 0.0001
  warmup_epochs: 25
  grad_clip_norm: 1.0
  use_amp: true
  early_stopping_patience: 100
  num_workers: 4
