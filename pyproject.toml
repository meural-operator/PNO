[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "padic-neural-operator"
version = "0.1.0"
description = "P-Adic Neural Operators for Learning PDE Solution Operators via Ultrametric Mathematics"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Ashish", email = "ashish.rsch@gmail.com"},
]
keywords = ["p-adic", "neural-operator", "PDE", "ultrametric", "deep-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
]

dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "h5py",
    "netCDF4",
    "xarray",
    "einops",
    "tqdm",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
examples = [
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
include = ["padic_neural_operator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
